<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ошибка 500</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
        }

        .container {
            max-width: 760px;
            margin: 60px auto;
            padding: 40px 50px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 30px;
            font-size: 36px;
            font-weight: 700;
            color: #b52b1e;
            text-align: left;
        }

        .message {
            font-size: 20px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .error-code {
            font-size: 15px;
            color: #555;
            margin-bottom: 35px;
        }

        .error-code code {
            font-family: Consolas, monospace;
            font-size: 14px;
            background-color: #f2f2f2;
            padding: 2px 6px;
            border-radius: 4px;
        }

        h3 {
            font-size: 24px;
            margin-bottom: 18px;
            color: #111;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        ul {
            margin: 0;
            padding-left: 22px;
        }

        li {
            margin-bottom: 14px;
            font-size: 18px;
            line-height: 1.5;
        }

        li strong {
            font-family: Consolas, monospace;
            font-size: 16px;
            color: #000;
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            font-size: 16px;
            color: #1d5fa7;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }

            .message {
                font-size: 18px;
            }

            li {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${status + ' — ' + title}">500 — Ошибка обработки запроса</h1>
    <p th:text="${message}">Что-то пошло не так.</p>
    <p th:if="${errorCode}">
        Код ошибки: <code th:text="${errorCode}"></code>
    </p>
    <div th:if="${violations != null and !violations.isEmpty()}">
        <ul>
            <li th:each="violation : ${violations}">
                <span th:text="${violation.field}">field</span>: <span th:text="${violation.error}">error</span>
            </li>
        </ul>
    </div>
</div>
</body>
</html>
