<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head th:replace="~{fragments/header-head :: header-head((customPageTitle=#{index.title}))}"></head>

<body>

<div th:replace="fragments/theme-switcher :: theme-switcher"></div>

<svg th:replace="fragments/theme-sprite-ico :: theme-sprite-ico"></svg>

<header th:replace="fragments/header-search-panel :: header-search-panel"></header>

<div class="container-fluid">
    <div class="row">
        <div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
            <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebarMenuLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
                </div>

                <div th:replace="fragments/header-left-panel :: header-left-panel"></div>
            </div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start">
                <h1 class="mt-2 h4">
                    <span th:text="${formOrder.new}
                            ? #{order.form.new.headers.h1}
                            : #{order.form.update.headers.h1(${formOrder.viewNum}, ${#temporals.format(formOrder.orderDate, 'dd.MM.yyyy')})}">
                    </span>
                </h1>
            </div>
            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start border-bottom mb-2">
                <h2 class="h5">
                    <span th:text="${formOrder.new}
                            ? #{order.form.new.headers.h2}
                            : ${formOrder.viewCustomerLongNameWithContactInfo}">
                    </span>
                    <span class="badge bg-secondary" th:text="${formOrder.customer.id}"></span>
                </h2>
            </div>
            <div class="small col-xl-8 col-lg-10 col-md-12">
                <form th:action="${formOrder.new} ? '/web/orders/create' : '/web/orders/' + ${order.id} + '/update'"
                      th:object="${formOrder}"
                      method="post">

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-light" th:text="#{main.btn.updateData}" disabled></button>
                        <a class="btn btn-primary"
                           th:href="@{/web/orders/{id}/show(id=${order.id})}"
                           th:text="#{main.btn.showData}">
                        </a>
                        <a id="btn-status-order" class="btn btn-light"
                           th:href="@{/web/orders/{id}/change-status/{listType}(id=${order.id}, listType=${listType})}"
                           th:text="#{main.btn.statusData}">
                        </a>
                        <button id="btn-clone-order" type="button" class="btn btn-light" th:text="#{main.btn.cloneData}"></button>
                        <button type="submit"
                                class="btn btn-light"
                                th:text="#{main.btn.save}">
                            Save
                        </button>
                    </div>

                    <input type="hidden" th:field="*{id}"/>
                    <input type="hidden" th:field="*{formCustomerType}"/>
                    <input type="hidden" th:field="*{formCustomerId}"/>
                    <input type="hidden" th:field="*{formCustomerCompanyId}"/>
                    <input type="hidden" th:field="*{formCustomerPersonId}"/>

                    <!-- Заказ -->
                    <div class="row g-3 mt-2 mb-3 align-items-start">
                        <div class="col-md-2">
                            <label for="input-order-no"
                                   class="form-label"
                                   th:text="#{order.form.fields.no}">
                            </label>
                            <input id="input-order-no"
                                   type="text"
                                   class="form-control form-control-sm"
                                   th:field="*{formOrderNum}"
                                   th:placeholder="#{order.form.fields.placeholder.no}"
                                   th:classappend="${#fields.hasErrors('formOrderNum')} ? ' is-invalid' : ''"/>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('formOrderNum')}"
                                 th:errors="*{formOrderNum}">
                            </div>
                        </div>

                        <div class="col-md-2">
                            <label for="input-order-orderDate"
                                   class="form-label"
                                   th:text="#{order.form.fields.orderDate}">
                            </label>
                            <div class="input-group input-group-sm">
                                <input type="text"
                                       th:field="*{orderDate}"
                                       id="input-order-orderDate"
                                       class="form-control datepicker"
                                       maxlength="10"
                                       required
                                       th:placeholder="#{order.form.fields.placeholder.orderDate}"
                                       th:classappend="${#fields.hasErrors('orderDate')} ? 'is-invalid' : ''"/>
                                <button class="btn btn-outline-secondary"
                                        onclick="$('#input-order-orderDate').datepicker('show');"
                                        type="button">
                                    <i class="bi bi-calendar-date text-dark"></i>
                                </button>
                            </div>
                            <div class="text-danger small mt-1"
                                 th:if="${#fields.hasErrors('orderDate')}"
                                 th:errors="*{orderDate}">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="select-store"
                                   class="form-label"
                                   th:text="#{order.form.fields.store}">
                            </label>
                            <select th:field="*{store}"
                                    id="select-store"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${storeTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.site}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3 align-items-start">
                        <div class="col-md-3">
                            <label for="select-order-type"
                                   class="form-label"
                                   th:text="#{order.form.fields.orderType}"></label>
                            <select th:field="*{type}"
                                    id="select-order-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${orderTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="select-order-source-type"
                                   class="form-label"
                                   th:text="#{order.form.fields.sourceType}"></label>
                            <select th:field="*{sourceType}"
                                    id="select-order-source-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${orderSourceTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="select-order-advert-type"
                                   class="form-label"
                                   th:text="#{order.form.fields.advertType}"></label>
                            <select th:field="*{advertType}"
                                    id="select-order-advert-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${orderAdvertTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="select-order-product-category"
                                   class="form-label"
                                   th:text="#{order.form.fields.productCategory}"></label>
                            <select th:field="*{formProductCategoryId}"
                                    id="select-order-product-category"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${productCategories}"
                                        th:value="${item.id}"
                                        th:text="${item.name}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-1">
                            <label for="input-order-offer-count-day" class="form-label">31.08.2021</label>
                            <input id="input-order-offer-count-day"
                                   name="offer.countDay"
                                   min="0"
                                   max="90"
                                   type="number"
                                   class="form-control form-control-sm"
                                   value="0">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label for="input-payment-annotation"
                                   class="form-label"
                                   th:text="#{order.form.fields.annotation}">
                            </label>
                            <textarea id="input-payment-annotation"
                                      th:field="*{annotation}"
                                      class="form-control form-control-sm"
                                      rows="2"
                                      maxlength="255"
                                      th:classappend="${#fields.hasErrors('annotation')} ? 'is-invalid'">
                            </textarea>
                        </div>
                    </div>

                    <!-- Покупатель -->
                    <h4 id="header-group-customer" class="mt-4 mb-3" th:text="#{order.form.headers.customer.company}"></h4>
                    <hr class="mb-4">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input radio-customer-type"
                                       type="radio"
                                       th:field="*{formCustomerType}"
                                       id="customer-types-PERSON"
                                       th:value="${T(com.afa.core.enums.CustomerTypes).PERSON}">

                                <label class="form-check-label"
                                       for="customer-types-PERSON"
                                       th:text="${T(com.afa.core.enums.CustomerTypes).PERSON.longName}">
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input radio-customer-type"
                                       type="radio"
                                       th:field="*{formCustomerType}"
                                       id="customer-types-COMPANY"
                                       th:value="${T(com.afa.core.enums.CustomerTypes).COMPANY}">
                                <label class="form-check-label"
                                       for="customer-types-COMPANY"
                                       th:text="${T(com.afa.core.enums.CustomerTypes).COMPANY.longName}">
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input radio-customer-type"
                                       type="radio"
                                       th:field="*{formCustomerType}"
                                       id="customer-types-BUSINESSMAN"
                                       th:value="${T(com.afa.core.enums.CustomerTypes).BUSINESSMAN}">
                                <label class="form-check-label"
                                       for="customer-types-BUSINESSMAN"
                                       th:text="${T(com.afa.core.enums.CustomerTypes).BUSINESSMAN.longName}">
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input radio-customer-type"
                                       type="radio"
                                       th:field="*{formCustomerType}"
                                       id="customer-types-FOREIGNER_PERSON"
                                       th:value="${T(com.afa.core.enums.CustomerTypes).FOREIGNER_PERSON}">
                                <label class="form-check-label"
                                       for="customer-types-FOREIGNER_PERSON"
                                       th:text="${T(com.afa.core.enums.CustomerTypes).FOREIGNER_PERSON.longName}">
                                </label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="form-check">
                                <input class="form-check-input radio-customer-type"
                                       type="radio"
                                       th:field="*{formCustomerType}"
                                       id="customer-types-FOREIGNER_COMPANY"
                                       th:value="${T(com.afa.core.enums.CustomerTypes).FOREIGNER_COMPANY}">
                                <label class="form-check-label"
                                       for="customer-types-FOREIGNER_COMPANY"
                                       th:text="${T(com.afa.core.enums.CustomerTypes).FOREIGNER_COMPANY.longName}">
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label for="select-customer-country"
                                   class="form-label"
                                   th:text="#{order.form.customer.fields.country}"></label>
                            <select th:field="*{formCustomerCountryId}"
                                    id="select-customer-country"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${countries}"
                                        th:value="${item.id}"
                                        th:text="${item.name}">
                                </option>
                            </select>
                        </div>
                    </div>


                    <div class="form-group-customer">

                        <div class="row g-3 mb-3 align-items-start">

                            <div class="col-md-3">
                                <label for="input-customer-phone"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.telephone}">
                                </label>
                                <div class="input-group input-group-sm">
                                    <input id="input-customer-phone"
                                           th:field="*{formCustomerContactPersonPhoneNumber}"
                                           th:placeholder="#{order.form.customer.fields.placeholder.telephone}"
                                           type="text"
                                           maxlength="15"
                                           class="form-control phone input-mask-phone form-control-customer-find"
                                           th:classappend="${#fields.hasErrors('formCustomerContactPersonPhoneNumber')} ? ' is-invalid' : ''"/>
                                    <button id="btn-find-customer-phone"
                                            class="btn btn-outline-secondary"
                                            type="button">
                                        <i class="bi bi-search text-dark"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="input-customer-email"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.email}">
                                </label>
                                <input id="input-customer-email"
                                       th:field="*{formCustomerContactPersonEmail}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.email}"
                                       type="text"
                                       maxlength="30"
                                       class="form-control form-control-sm form-control-customer-find"/>
                            </div>

                            <div class="col-md-5">
                                <label class="form-label">&nbsp;</label>

                                <div class="dropdown">
                                    <button id="btn-find-customer-orders"
                                            class="btn btn-sm btn-light dropdown-toggle"
                                            type="button"
                                            data-bs-toggle="dropdown"
                                            aria-expanded="false">
                                        <span th:text="#{orders.btn.customerOrders}"></span>
                                        <span class="badge bg-secondary">0</span>
                                    </button>

                                    <div class="dropdown-menu dropdown-menu-customer-orders">
                                        <!-- dynamic customer orders -->
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div class="row g-3 mb-3">

                            <div class="col-md-3">
                                <label for="input-customer-first-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.firstName}">
                                </label>
                                <input id="input-customer-first-name"
                                       th:field="*{formCustomerContactPersonFirstName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.firstName}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       th:classappend="${#fields.hasErrors('formCustomerContactPersonFirstName')} ? ' is-invalid' : ''"/>
                            </div>
                            <div class="col-md-4">
                                <label for="input-customer-middle-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.middleName}">
                                </label>
                                <input id="input-customer-middle-name"
                                       th:field="*{formCustomerContactPersonMiddleName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.middleName}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       th:classappend="${#fields.hasErrors('formCustomerContactPersonMiddleName')} ? ' is-invalid' : ''"/>
                            </div>
                            <div class="col-md-5">
                                <label for="input-customer-last-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.lastName}">
                                </label>
                                <input id="input-customer-last-name"
                                       th:field="*{formCustomerContactPersonLastName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.lastName}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       th:classappend="${#fields.hasErrors('formCustomerContactPersonLastName')} ? ' is-invalid' : ''"/>
                            </div>
                        </div>
                    </div>

                    <!-- Юридическое лицо -->
                    <div class="form-group-company">
                        <div class="row g-3 mb-4">
                            <div class="col-md-2">
                                <label for="input-customer-inn"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.inn}"></label>
                                <input id="input-customer-inn"
                                       th:field="*{formCustomerInn}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.inn}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       maxlength="12"
                                       th:classappend="${#fields.hasErrors('formCustomerInn')} ? ' is-invalid' : ''"/>
                            </div>

                            <div class="col-md-3">
                                <label for="input-customer-short-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.shortName}"></label>
                                <input id="input-customer-short-name"
                                       th:field="*{formCustomerShortName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.shortName}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       maxlength="12"
                                       th:classappend="${#fields.hasErrors('formCustomerShortName')} ? ' is-invalid' : ''"/>
                            </div>

                            <div class="col-md-7">
                                <label for="input-customer-long-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.longName}">
                                </label>
                                <input id="input-customer-long-name"
                                       th:field="*{formCustomerLongName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.longName}"
                                       type="text"
                                       class="form-control form-control-sm"
                                       maxlength="12"
                                       th:classappend="${#fields.hasErrors('formCustomerLongName')} ? ' is-invalid' : ''"/>
                            </div>
                        </div>

                        <h5 class="mt-3 mb-3" th:text="#{order.form.headers.customer.contact}"></h5>

                        <div class="row g-3 mb-3">
                             <div class="col-md-3">
                                <label for="input-customer-contact-first-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.contact.firstName}">
                                </label>
                                <input id="input-customer-contact-first-name"
                                       th:field="*{formCustomerContactPersonFirstName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.contact.firstName}"
                                       type="text"
                                       class="form-control form-control-sm">
                            </div>

                            <div class="col-md-4">
                                <label for="input-customer-contact-middle-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.contact.middleName}">
                                </label>
                                <input id="input-customer-contact-middle-name"
                                       th:field="*{formCustomerContactPersonMiddleName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.contact.middleName}"
                                       type="text"
                                       class="form-control form-control-sm">
                            </div>

                            <div class="col-md-5">
                                <label for="input-customer-contact-middle-name"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.contact.lastName}">
                                </label>
                                <input id="input-customer-contact-last-name"
                                       th:field="*{formCustomerContactPersonLastName}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.contact.lastName}"
                                       type="text"
                                       class="form-control form-control-sm">
                            </div>
                        </div>

                        <div class="row g-3 mb-3 align-items-start">
                            <div class="col-md-3">
                                <label for="input-customer-contact-phone"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.contact.telephone}">
                                </label>
                                <div class="input-group input-group-sm">
                                    <input id="input-customer-contact-phone"
                                           th:field="*{formCustomerContactPersonPhoneNumber}"
                                           th:placeholder="#{order.form.customer.fields.placeholder.contact.telephone}"
                                           type="text"
                                           class="form-control phone input-mask-phone form-control-customer-find"
                                           maxlength="15">
                                    <button id="btn-find-customer-contact-phone"
                                            class="btn btn-outline-secondary"
                                            type="button">
                                        <i class="bi bi-search text-dark"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-9">
                                <label for="input-customer-contact-email"
                                       class="form-label"
                                       th:text="#{order.form.customer.fields.contact.email}">
                                </label>
                                <input id="input-customer-contact-email"
                                       th:field="*{formCustomerContactPersonEmail}"
                                       th:placeholder="#{order.form.customer.fields.placeholder.contact.email}"
                                       type="text"
                                       class="form-control form-control-sm form-control-customer-find">
                            </div>
                        </div>
                    </div>

                    <!-- Доставка и оплата -->
                    <h4 class="mt-4 mb-3" th:text="#{order.form.headers.delivery}"></h4>
                    <hr class="mb-4">

                    <div class="row g-3 mb-3">
                        <div class="col-md-2">
                            <label for="select-payment-type"
                                   class="form-label"
                                   th:text="#{order.form.payment.fields.type}"></label>
                            <select th:field="*{paymentType}"
                                    id="select-payment-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${orderPaymentTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label for="select-payment-delivery-type"
                                   class="form-label"
                                   th:text="#{order.form.delivery.fields.paymentType}"></label>
                            <select th:field="*{delivery.deliveryPaymentType}"
                                    id="select-payment-delivery-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${deliveryPaymentTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="select-delivery-type"
                                   class="form-label"
                                   th:text="#{order.form.delivery.fields.type}"></label>
                            <select th:field="*{delivery.deliveryType.code}"
                                    id="select-delivery-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${deliveryTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <label for="select-delivery-price-type"
                                   class="form-label"
                                   th:text="#{order.form.delivery.fields.priceType}"></label>
                            <select th:field="*{delivery.deliveryPriceType}"
                                    id="select-delivery-price-type"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${deliveryPriceTypes}"
                                        th:value="${item.code}"
                                        th:text="${item.annotation}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label for="select-delivery-address-country"
                                   class="form-label"
                                   th:text="#{order.form.delivery.fields.country}">
                            </label>
                            <select th:field="*{delivery.recipient.country.id}"
                                    id="select-delivery-address-country"
                                    class="form-select form-select-sm">
                                <option th:each="item : ${countries}"
                                        th:value="${item.id}"
                                        th:text="${item.name}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12">
                            <label for="input-delivery-address"
                                   class="form-label"
                                   th:text="#{order.form.delivery.fields.address}">
                            </label>
                            <textarea id="input-delivery-address"
                                      th:field="*{formDeliveryAddressAddressLine}"
                                      name="delivery.address.address"
                                      maxlength="255"
                                      class="form-control form-control-sm"
                                      rows="2"
                                      th:placeholder="#{order.form.delivery.fields.placeholder.address}"
                                      th:classappend="${#fields.hasErrors('formDeliveryAddressAddressLine')} ? ' is-invalid' : ''">
                            </textarea>
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('formDeliveryAddressAddressLine')}"
                                 th:errors="*{formDeliveryAddressAddressLine}">
                            </div>
                        </div>

                    </div>
                    <div class="form-check mb-3">
                        <input id="check-delivery-customer-equals-recipient"
                               th:field="*{formDeliveryCustomerEqualsRecipient}"

<script>
    const container = document.getElementById('order-items-container');
    const template = document.getElementById('order-item-template');
    const addButton = document.getElementById('btn-add-order-item');

    function reindexOrderItems() {
        container.querySelectorAll('.order-item-row').forEach((row, index) => {
            row.querySelectorAll('[name], [data-name]').forEach(input => {
                const fieldName = input.dataset.name || input.name.replace(/^items\[\d+\]\./, '');
                input.name = `items[${index}].${fieldName}`;
            });
        });
    }

    function parseMoney(value) {
        if (!value) {
            return 0;
        }

        let normalized = value.toString().trim();

        // если есть и точка и запятая → определяем формат
        if (normalized.includes(',') && normalized.includes('.')) {

            // формат 4,725.00
            if (normalized.lastIndexOf('.') > normalized.lastIndexOf(',')) {
                normalized = normalized.replace(/,/g, '');
            }
            // формат 4.725,00
            else {
                normalized = normalized.replace(/\./g, '').replace(',', '.');
            }

        } else if (normalized.includes(',')) {
            // формат 4725,00
            normalized = normalized.replace(',', '.');
        }

        normalized = normalized.replace(/\s/g, '');

        return Number(normalized) || 0;
    }

    function formatMoney(value) {
        return value.toLocaleString('ru-RU', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function recalcRow(row) {
        const quantity = parseMoney(row.querySelector('.item-quantity')?.value);
        const price = parseMoney(row.querySelector('.item-price')?.value);
        const discount = parseMoney(row.querySelector('.item-discount')?.value);

        const amount = quantity * price * (100 - discount) / 100;

        const amountInput = row.querySelector('.item-amount');
        if (amountInput) {
            amountInput.value = formatMoney(amount);
        }
    }

    function recalcTotals() {
        let total = 0;
        let supplierTotal = 0;

        const postpay = parseMoney(document.getElementById('input-amounts-postpay')?.value);
        container.querySelectorAll('.order-item-row').forEach(row => {
            const quantity = parseMoney(row.querySelector('.item-quantity')?.value);
            const price = parseMoney(row.querySelector('.item-price')?.value);
            const supplierPrice = parseMoney(row.querySelector('.item-supplier-price')?.value);
            const discount = parseMoney(row.querySelector('.item-discount')?.value);

            total += quantity * price * (100 - discount) / 100;
            supplierTotal += quantity * supplierPrice;
        });

        const margin = total - supplierTotal;
        const deliveryInput = document.getElementById('input-delivery-price');
        const deliveryAmount = deliveryInput ? parseMoney(deliveryInput.value) : 0;

        document.getElementById('details-items-amounts-total').textContent = formatMoney(total);
        document.getElementById('details-items-amounts-delivery').textContent = formatMoney(deliveryAmount);
        document.getElementById('details-items-amounts-total-with-delivery').textContent = formatMoney(total + deliveryAmount);

        document.getElementById('details-items-amounts-supplier').textContent = formatMoney(supplierTotal);
        document.getElementById('details-items-amounts-margin').textContent = formatMoney(margin);
        document.getElementById('details-items-amounts-postpay').textContent = formatMoney(postpay);
    }

    function addOrderItemRow() {
        const fragment = template.content.cloneNode(true);
        container.appendChild(fragment);

        reindexOrderItems();

        const lastRow = container.querySelector('.order-item-row:last-child');
        if (lastRow) {
            recalcRow(lastRow);
            recalcTotals();
        }
    }

    addButton.addEventListener('click', addOrderItemRow);

    container.addEventListener('click', function (event) {
        const removeButton = event.target.closest('.btn-remove-order-item');

        if (!removeButton) {
            return;
        }

        removeButton.closest('.order-item-row').remove();
        reindexOrderItems();
    });

    container.addEventListener('input', function (event) {
        const row = event.target.closest('.order-item-row');

        if (!row) {
            return;
        }

        if (
            event.target.classList.contains('item-quantity') ||
            event.target.classList.contains('item-price') ||
            event.target.classList.contains('item-discount')
        ) {
            recalcRow(row);
            recalcTotals();
        }
    });

    function normalizeMoneyForSubmit(value) {
        if (!value) {
            return '';
        }

        return value.toString()
            .replace(/\u00A0/g, '')
            .replace(/\s/g, '')
            .replace(',', '.');
    }

    document.querySelector('form').addEventListener('submit', function () {
        reindexOrderItems();

        container.querySelectorAll('.order-item-row').forEach(row => {
            recalcRow(row);
            recalcTotals();
        });

        document.querySelectorAll('.item-price, .item-supplier-price, .item-amount').forEach(input => {
            input.value = normalizeMoneyForSubmit(input.value);
        });

        document.querySelectorAll('.item-discount').forEach(input => {
            input.value = parseInt(input.value || '0', 10);
        });

        $('.input-mask-phone').each(function () {
            $(this).val($(this).cleanVal());
        });

        const customerBlock = document.querySelector('.form-group-customer');
        const companyBlock = document.querySelector('.form-group-company');

        if (customerBlock.classList.contains('d-none')) {
            customerBlock.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
        }

        if (companyBlock.classList.contains('d-none')) {
            companyBlock.querySelectorAll('input, select, textarea').forEach(el => el.disabled = true);
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        container.querySelectorAll('.order-item-row').forEach(row => {
            recalcRow(row);
        });
        recalcTotals();
    });

    async function findProductSuggest(query) {
        const response = await fetch(
            '/web/wiki/products/suggest?nameContext=' + encodeURIComponent(query),
            {
                method: 'GET',
                headers: {
                    'Accept': 'application/json'
                }
            }
        );

        if (!response.ok) {
            throw new Error('Ошибка поиска товара');
        }

        return await response.json();
    }

    container.addEventListener('click', async function (event) {
        const findButton = event.target.closest('.btn-find-details-item-product');

        if (!findButton) {
            return;
        }

        const row = findButton.closest('.order-item-row');

        if (!row) {
            return;
        }

        const productNameInput = row.querySelector('input[name$=".product.shortName"]');
        const productIdInput = row.querySelector('.input-product-id');
        const productSkuInput = row.querySelector('.input-product-sku');
        const priceInput = row.querySelector('.item-price');
        const supplierPriceInput = row.querySelector('.item-supplier-price');

        const query = productNameInput?.value?.trim();

        if (!query || query.length < 2) {
            alert('Введите минимум 2 символа для поиска товара');
            return;
        }

        try {
            const result = await findProductSuggest(query);

            if (!result.items || result.items.length === 0) {
                alert('Товар не найден');
                return;
            }

            const productSkuBadge = row.querySelector('.span-product-sku');
            const productStockBadge = row.querySelector('.span-product-stock-info');
            const product = result.items[0];

            if (productIdInput) {
                productIdInput.value = product.id || '';
            }

            if (productSkuInput) {
                productSkuInput.value = product.sku || '';
            }

            if (productNameInput) {
                productNameInput.value = product.shortName || '';
            }

            if (priceInput && product.price != null) {
                priceInput.value = formatMoney(product.price);
            }

            if (supplierPriceInput && product.stock?.supplierPrice != null) {
                supplierPriceInput.value = formatMoney(product.stock.supplierPrice);
            }

            if (productSkuBadge) {
                productSkuBadge.textContent = product.sku || '';
            }

            if (productStockBadge) {
                productStockBadge.textContent = product.viewStockQuantityText || '';

                productStockBadge.className = 'badge mt-1 span-product-stock-info text-bg-' +
                    (product.viewStockQuantityClass || 'light');
            }

            recalcRow(row);
            recalcTotals();

        } catch (error) {
            console.error(error);
            alert('Ошибка поиска товара');
        }
    });

            if (checkbox.checked) {

    function updateCustomerHeader() {
        const selectedRadio = document.querySelector('.radio-customer-type:checked');
        const header = document.getElementById('header-group-customer');

        if (!selectedRadio || !header) {
            return;
        }

        const labels = {
            PERSON: 'Покупатель (физическое лицо)',
            COMPANY: 'Покупатель (юридическое лицо)',
            BUSINESSMAN: 'Покупатель (индивидуальный предприниматель)',
            FOREIGNER_PERSON: 'Покупатель (нерезидент, физическое лицо)',
            FOREIGNER_COMPANY: 'Покупатель (нерезидент, юридическое лицо)'
        };

        header.textContent = labels[selectedRadio.value] || 'Покупатель';
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.radio-customer-type').forEach(radio => {
            radio.addEventListener('change', updateCustomerHeader);
        });

        updateCustomerHeader();
    });

    function toggleCustomerTypeBlocks() {
        const selectedRadio = document.querySelector('.radio-customer-type:checked');
        const customerBlock = document.querySelector('.form-group-customer');
        const companyBlock = document.querySelector('.form-group-company');

        if (!selectedRadio || !customerBlock || !companyBlock) {
            return;
        }

        const personTypes = ['PERSON', 'FOREIGNER_PERSON'];
        const companyTypes = ['COMPANY', 'BUSINESSMAN', 'FOREIGNER_COMPANY'];

        const selectedType = selectedRadio.value;

        customerBlock.classList.toggle('d-none', !personTypes.includes(selectedType));
        companyBlock.classList.toggle('d-none', !companyTypes.includes(selectedType));
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.radio-customer-type').forEach(radio => {
            radio.addEventListener('change', function () {
                updateCustomerHeader();
                toggleCustomerTypeBlocks();
            });
        });

        updateCustomerHeader();
        toggleCustomerTypeBlocks();
    });

    document.addEventListener('DOMContentLoaded', function () {
        const findCustomerButton = document.getElementById('btn-find-customer-phone');

        if (!findCustomerButton) {
            return;
        }

        findCustomerButton.addEventListener('click', async function () {
            const phoneInput = document.getElementById('input-customer-phone');
            const selectedCustomerType = document.querySelector('.radio-customer-type:checked');

            if (!phoneInput || !selectedCustomerType) {
                return;
            }

            const phoneNumber = phoneInput.value.trim();

            if (!phoneNumber) {
                alert('Введите телефон');
                return;
            }

            const requestBody = {
                pageNumber: 1,
                resultsOnPage: 10,
                conditions: {
                    customerTypes: [selectedCustomerType.value],
                    personPhoneNumber: phoneNumber
                }
            };

            try {
                const response = await fetch('/web/wiki/integrations/union/customers/suggest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error('Ошибка поиска клиента');
                }

                const result = await response.json();
                console.log('Customer suggest response:', result);

                document.querySelector('input[name="formCustomerId"]').value = result.customer?.id || '';
                document.getElementById('input-customer-first-name').value = result.customer?.person?.firstName || '';
                document.getElementById('input-customer-middle-name').value = result.customer?.person?.middleName || '';
                document.getElementById('input-customer-last-name').value = result.customer?.person?.lastName || '';

                document.getElementById('input-customer-phone').value = result.customer?.person?.phoneNumber || '';
                document.getElementById('input-customer-email').value = result.customer?.person?.email || '';
                document.querySelector('input[name="formCustomerPersonId"]').value = result.customer?.person?.id || '';

            } catch (error) {
                console.error('Ошибка запроса customer suggest:', error);
                alert('Ошибка поиска клиента');
            }
        });
    });

    document.getElementById('btn-find-delivery-cdek-city').addEventListener('click', async function () {
        const cityName = document.getElementById('input-delivery-cdek-city-search').value.trim();
        const citySelect = document.getElementById('select-delivery-cdek-city');

        if (!cityName) {
            console.warn('Город не указан');
            return;
        }

        try {
            const response = await fetch(
                `/web/wiki/integrations/cdek/location/cities?countryCode2=RU&cityNameContext=${encodeURIComponent(cityName)}`,
                {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`Ошибка HTTP: ${response.status}`);
            }

            const result = await response.json();
            console.log('Города СДЭК:', result);

            citySelect.innerHTML = '';
            if (!result.items || result.items.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'Города не найдены';
                citySelect.appendChild(option);
                return;
            }

            result.items.forEach(city => {
                const option = document.createElement('option');

                option.value = city.code;
                option.textContent = `${city.city}, ${city.region || ''}, ${city.country}`;

                option.dataset.city = city.city;
                option.dataset.region = city.region || '';
                option.dataset.country = city.country;
                option.dataset.code = city.code;
                option.dataset.cityUuid = city.city_uuid || '';
                option.dataset.fiasGuid = city.fias_guid || '';
                citySelect.appendChild(option);
            });
            citySelect.selectedIndex = 0;

            if (result.items.length === 1) {
                await loadCdekDeliveryPoints();
            }

        } catch (error) {
            console.error('Ошибка поиска города СДЭК:', error);
        }
    });


    document.getElementById('select-delivery-cdek-city').addEventListener('change', loadCdekDeliveryPoints);

    async function loadCdekDeliveryPoints() {
        const citySelect = document.getElementById('select-delivery-cdek-city');
        const pvzSelect = document.getElementById('select-delivery-cdek-pvz');

        const cityCode = citySelect.value;
        pvzSelect.innerHTML = '';

        if (!cityCode) {
            return;
        }

        try {
            const response = await fetch(
                `/web/wiki/integrations/cdek/deliveryPoints?countryCode2=RU&cityCode=${encodeURIComponent(cityCode)}`,
                {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                }
            );

            if (!response.ok) {
                throw new Error(`Ошибка HTTP: ${response.status}`);
            }

            const result = await response.json();
            console.log('ПВЗ СДЭК:', result);

            if (result.result && result.result !== 'ok') {
                throw new Error(result.errorMessage || 'Ошибка получения ПВЗ СДЭК');
            }

            const items = Array.isArray(result)
                ? result
                : Array.isArray(result.items)
                    ? result.items
                    : [];

            if (items.length === 0) {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'ПВЗ не найдены';
                pvzSelect.appendChild(option);
                return;
            }

            items.forEach(pvz => {
                const option = document.createElement('option');

                const address = pvz.location?.address || pvz.location?.addressFull || '';

                option.value = pvz.code || '';
                option.textContent = `[${pvz.code}] ${address}`;

                option.dataset.code = pvz.code || '';
                option.dataset.uuid = pvz.uuid || '';
                option.dataset.name = pvz.name || '';
                option.dataset.address = address;
                option.dataset.city = pvz.location?.city || '';
                option.dataset.region = pvz.location?.region || '';

                pvzSelect.appendChild(option);
            });

        } catch (error) {
            console.error('Ошибка загрузки ПВЗ СДЭК:', error);
        }
    }

    function toggleBlockState(block, enabled) {
        block.classList.toggle('d-none', !enabled);

        block.querySelectorAll('input, select, textarea').forEach(el => {
            el.disabled = !enabled;
        });
    }
