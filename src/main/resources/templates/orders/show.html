<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head th:replace="~{fragments/header-head :: header-head((customPageTitle=#{index.title}))}"></head>

<body>

<div th:replace="fragments/theme-switcher :: theme-switcher"></div>

<svg th:replace="fragments/theme-sprite-ico :: theme-sprite-ico"></svg>

<header th:replace="fragments/header-search-panel :: header-search-panel"></header>

<div class="container-fluid">
    <div class="row">

        <div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
            <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebarMenuLabel">SIR RICHARD BOSS</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
                </div>

                <div th:replace="fragments/header-left-panel :: header-left-panel"></div>
            </div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="#{order.show.header}"></h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary">Share</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary">Export</button>
                    </div>
                    <button type="button"
                            class="btn btn-sm btn-outline-secondary dropdown-toggle d-flex align-items-center gap-1">
                        <svg class="bi" aria-hidden="true">
                            <use xlink:href="#calendar3"></use>
                        </svg>
                        This week
                    </button>
                </div>
            </div>

            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start">

                <h1 class="h4">
                    <span th:text="#{order.show.headers.h1(${order.viewNum}, ${#temporals.format(order.orderDate, 'dd.MM.yyyy')})}">
                        Заказ № XXX от XX.XX.XXXX
                    </span>
                </h1>
            </div>

            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start border-bottom mb-2">
                <h2 class="h5">
                    <span th:text="${order.customer.viewLongNameWithContactInfo}">Иванов Иван Иванович</span>&nbsp;
                    <span class="badge bg-secondary" th:text="${order.customer.id}">XXX</span>
                </h2>
            </div>

            <div class="d-flex gap-2">
                <button id="btn-update-order" type="button" class="btn btn-primary"
                        th:text="#{main.btn.updateData}"></button>

                <button id="btn-show-order" type="button" class="btn btn-light"
                        th:text="#{main.btn.showData}" disabled></button>

                <button id="btn-status-order" type="button" class="btn btn-light"
                        th:text="#{main.btn.statusData}"></button>

                <button id="btn-clone-order" type="button" class="btn btn-light"
                        th:text="#{main.btn.cloneData}"></button>
            </div>
            <br>

            <!-- Навигация по вкладкам -->
            <ul class="nav nav-tabs" id="orderTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active"
                            id="order-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#order"
                            type="button"
                            role="tab"
                            aria-controls="order"
                            aria-selected="true"
                            th:text="#{order.show.tabs.order}">
                        Заказ
                    </button>
                </li>

                <li class="nav-item" role="presentation">
                    <button class="nav-link"
                            id="customer-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#customer"
                            type="button"
                            role="tab"
                            aria-controls="customer"
                            aria-selected="false"
                            th:text="#{order.show.tabs.customer}">
                        Клиент
                    </button>
                </li>

                <li class="nav-item" role="presentation">
                    <button class="nav-link"
                            id="delivery-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#delivery"
                            type="button"
                            role="tab"
                            aria-controls="delivery"
                            aria-selected="false"
                            th:text="#{order.show.tabs.delivery}">
                        Доставка
                    </button>
                </li>

                <li class="nav-item" role="presentation">
                    <button class="nav-link"
                            id="amount-tab"
                            data-bs-toggle="tab"
                            data-bs-target="#amount"
                            type="button"
                            role="tab"
                            aria-controls="amount"
                            aria-selected="false"
                            th:text="#{order.show.tabs.calculate}">
                        Суммы
                    </button>
                </li>
            </ul>

            <!-- Контент вкладок -->
            <div class="tab-content mt-3" id="orderTabContent">
                <!-- Вкладка Заказ -->
                <div class="tab-pane fade show active"
                     id="order"
                     role="tabpanel"
                     aria-labelledby="order-tab">
                    <div class="container-fluid">
                        <h5 th:text="#{order.show.tabs.order}">Заказ</h5>
                        <!-- Здесь будет контент для вкладки "Заказ" -->
                    </div>
                </div>

                <!-- Вкладка Клиент -->
                <div class="tab-pane fade"
                     id="customer"
                     role="tabpanel"
                     aria-labelledby="customer-tab">
                    <div class="container-fluid">
                        <h5 th:text="#{order.show.tabs.customer}">Клиент</h5>
                        <!-- Контент вкладки "Клиент" -->
                    </div>
                </div>

                <!-- Вкладка Доставка -->
                <div class="tab-pane fade"
                     id="delivery"
                     role="tabpanel"
                     aria-labelledby="delivery-tab">
                    <div class="container-fluid">
                        <h5 th:text="#{order.show.tabs.delivery}">Доставка</h5>
                        <!-- Контент вкладки "Доставка" -->
                    </div>
                </div>

                <!-- Вкладка Суммы -->
                <div class="tab-pane fade"
                     id="amount"
                     role="tabpanel"
                     aria-labelledby="amount-tab">
                    <div class="container-fluid">
                        <h5 th:text="#{order.show.tabs.calculate}">Доставка</h5>
                        <!-- Контент вкладки "Доставка" -->
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<div th:replace="fragments/footer-scripts :: footer-scripts"></div>

</body>
</html>
