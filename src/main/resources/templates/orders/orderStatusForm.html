<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head th:replace="~{fragments/header-head :: header-head(customPageTitle=#{index.title},pageCss=null)}"></head>

<body>

<div th:replace="fragments/theme-switcher :: theme-switcher"></div>

<svg th:replace="fragments/theme-sprite-ico :: theme-sprite-ico"></svg>

<header th:replace="fragments/header-search-panel :: header-search-panel"></header>

<div class="container-fluid">
    <div class="row">
        <div class="sidebar border border-right col-md-3 col-lg-2 p-0 bg-body-tertiary">
            <div class="offcanvas-md offcanvas-end bg-body-tertiary" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="sidebarMenuLabel"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
                </div>

                <div th:replace="fragments/header-left-panel :: header-left-panel"></div>
            </div>
        </div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start">
                <h1 class="mt-2 h4">
                    <span th:text="#{order.form.changeStatus.headers.h1(${order.viewNum}, ${#temporals.format(order.orderDate, 'dd.MM.yyyy')})}">
                        Заказ № XXX от XX.XX.XXXX
                    </span>
                </h1>
            </div>
            <div class="d-flex justify-content-start flex-wrap flex-md-nowrap align-items-start border-bottom mb-2">
                <h2 class="h5">
                    <span th:text="${order.customer.viewLongNameWithContactInfo}"></span>&nbsp;
                    <span class="badge bg-secondary" th:text="${order.customer.id}"></span>
                </h2>
            </div>

            <div class="d-flex gap-2">
                <a id="btn-update-order" class="btn btn-primary"
                   th:href="@{/web/orders/{id}/update(id=${order.id})}"
                   th:text="#{main.btn.updateData}">
                </a>
                <a class="btn btn-light"
                   th:href="@{/web/orders/{id}/show(id=${order.id})}"
                   th:text="#{main.btn.showData}">
                </a>

                <button id="btn-status-order" type="button" class="btn btn-light" th:text="#{main.btn.statusData}" disabled></button>

                <button id="btn-clone-order" type="button" class="btn btn-light"
                        th:text="#{main.btn.cloneData}"></button>
            </div>
            <form th:action="@{/web/orders/{orderId}/change-status/{listType}(orderId=${order.id}, listType=${listType})}"
                  th:object="${formOrder}"
                  method="post">

                <input type="hidden" th:field="*{id}"/>
                <input type="hidden" th:field="*{formOrderNum}"/>
                <input type="hidden" th:field="*{formDeliveryAddressAddressLine}"/>

                <div class="row mb-3">
                    <div class="col-4">
                        <label for="select-order-type" class="form-label" th:text="#{order.form.fields.orderType}"></label>
                        <select th:field="*{type}"
                                id="select-order-type"
                                class="form-select form-select-sm">
                            <option th:each="item : ${orderTypes}"
                                    th:value="${item.code}"
                                    th:text="${item.annotation}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="select-order-source-type" class="form-label" th:text="#{order.form.fields.sourceType}"></label>
                        <select th:field="*{sourceType}"
                                id="select-order-source-type"
                                class="form-select form-select-sm">
                            <option th:each="item : ${orderSourceTypes}"
                                    th:value="${item.code}"
                                    th:text="${item.annotation}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="select-order-payment-type" class="form-label" th:text="#{order.form.delivery.fields.paymentType}"></label>
                        <select th:field="*{paymentType}"
                                id="select-order-payment-type"
                                class="form-select form-select-sm">
                            <option th:each="item : ${orderPaymentTypes}"
                                    th:value="${item.code}"
                                    th:text="${item.annotation}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="select-order-product-category-type" class="form-label" th:text="#{order.form.fields.productCategory}"></label>
                        <select th:field="*{formProductCategoryId}"
                                id="select-order-product-category-type"
                                class="form-select form-select-sm">
                            <option th:each="item : ${productCategories}"
                                    th:value="${item.id}"
                                    th:text="${item.name}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="select-order-status" class="form-label" th:text="#{order.form.fields.orderStatus}"></label>
                        <select th:field="*{formStatusCode}"
                                id="select-order-status"
                                class="form-select form-select-sm">
                            <option th:each="item : ${orderStatuses}"
                                    th:value="${item.code}"
                                    th:text="${item.annotation}">
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="input-payment-annotation"
                               class="form-label"
                               th:text="#{order.form.fields.annotation}">
                            Annotation
                        </label>
                        <textarea id="input-payment-annotation"
                                  th:field="*{annotation}"
                                  class="form-control form-control-sm"
                                  th:classappend="${#fields.hasErrors('annotation')} ? 'is-invalid'">
                        </textarea>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-4">
                        <label for="input-delivery-trackCode"
                               class="form-label"
                               th:text="#{order.form.delivery.fields.trackCode}">
                            Track Code
                        </label>
                        <input type="text"
                               th:field="*{delivery.trackCode}"
                               id="input-delivery-trackCode"
                               class="form-control form-control-sm"/>
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('delivery.trackCode')}"
                             th:errors="*{delivery.trackCode}">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary"
                            th:text="#{main.btn.save}">
                        Save
                    </button>
                    <a class="btn btn-light"
                       th:href="@{/web/orders/{orderId}/{listType}(orderId=${order.id}, listType=${listType})}"
                       th:text="#{main.btn.cancel}">
                        Cancel
                    </a>
                </div>

            </form>
        </main>
    </div>
</div>

<div th:replace="fragments/footer-scripts :: footer-scripts"></div>

</body>
</html>
